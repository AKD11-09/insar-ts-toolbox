[pycodestyle]
# Project style standard. 79 is impractical for PyQt signal/slot code and the
# embedded HTML used by the About dialog and Help tab.
max-line-length = 100

# Continuation-line and whitespace-before-colon rules that conflict with the
# way Qt argument lists are laid out here.
ignore = E203,E121,E122,E123,E124,E125,E126,E127,E128

exclude = .git,__pycache__,help,i18n,scripts,test,dist,build

# Known remaining exceptions, all inside triple-quoted HTML strings for the
# About dialog and Help tab, where wrapping would change the rendered text:
#   E501 - long <li>/<a href> lines
#   W291 - trailing whitespace inside the HTML literals
